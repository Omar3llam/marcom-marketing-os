<!doctype html>
<!--
  LUMI landing review page — Phase 4 visual review surface. NOT a production page.
  Served only by the Vite dev server at /lumi-landing.html. `vite build` builds
  index.html alone, so this file and its module never enter client/dist.
  The <html> and <body> attributes and the skip link copy client/index.html so the
  landing is reviewed inside the same document shell production gives it.
-->
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>LUMI landing review — not a production page</title>
  </head>
  <body class="bg-lumi-bg text-lumi-text antialiased">
    <a
      href="#main-content"
      data-lumi-env="marketing"
      class="lumi-skip-link sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-[100] focus:px-3 focus:py-1.5 focus:rounded-lg focus:font-display focus:font-semibold focus:text-sm"
    >Skip to main content</a>
    <div id="root"></div>
    <script type="module" src="/src/lumi/lab/landingMain.jsx"></script>
  </body>
</html>
