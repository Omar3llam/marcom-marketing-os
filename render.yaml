# ============================================================
# MARCOM / Lumi — Render.com Blueprint  (Phase 7)
# ------------------------------------------------------------
# Three services + one managed Postgres.
#
#   1. lumi-backend  — Express API + serves the React build
#   2. lumi-worker   — BullMQ Action + Observer workers
#   3. lumi-redis    — managed Redis (used by BullMQ)
#   4. lumi-postgres — managed Postgres (used by Prisma)
#
# Deviation from the V1.2 task spec: Render's blueprint schema
# puts Redis under `services:` (type: redis), NOT under
# `databases:`. Only Postgres lives under `databases:`. The file
# below uses Render's canonical schema so the blueprint imports
# cleanly via dashboard.render.com → New → Blueprint.
# ============================================================
services:
  # ── Web service: Express API + React static ───────────────
  - type: web
    name: lumi-backend
    env: node
    region: oregon
    plan: starter
    # `npm run build` itself runs `npm install --include=dev` for both
    # root and client, so we don't need a separate `npm install` here.
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

      # Wired automatically from the blueprint-managed services
      - key: DATABASE_URL
        fromDatabase:
          name: lumi-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: lumi-redis
          property: connectionString

      # Auth
      - key: JWT_SECRET
        sync: false
      - key: JWT_ISSUER
        value: lumi-api
      - key: JWT_AUDIENCE
        value: lumi-clients

      # AI providers
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-5
      - key: OPENAI_API_KEY
        sync: false

      # Ad-platform credentials
      - key: META_ACCESS_TOKEN
        sync: false
      - key: GOOGLE_ADS_TOKEN
        sync: false

      # Notifications & link signing
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: HMAC_SECRET
        sync: false
      - key: QUICK_ACTION_HMAC_SECRET
        sync: false
      - key: WEBHOOK_SECRET
        sync: false

      # Legacy Clerk (during cutover only)
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      # Vite client env — baked into the bundle at build time.
      # MUST be the SAME publishable key as CLERK_PUBLISHABLE_KEY.
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false

      # Credential vault
      - key: CREDENTIAL_ENCRYPTION_KEY
        sync: false

  # ── Background worker: BullMQ Action + Observer ───────────
  - type: worker
    name: lumi-worker
    env: node
    region: oregon
    plan: starter
    buildCommand: npm install
    startCommand: npm run worker
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lumi-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: lumi-redis
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: BULLMQ_CONCURRENCY
        value: 5
      - key: OBSERVER_CRON
        value: "*/15 * * * *"
      - key: OBSERVER_IMPACT_WINDOW_HRS
        value: 24
      - key: CREDENTIAL_ENCRYPTION_KEY
        sync: false

  # ── Managed Redis (for BullMQ) ────────────────────────────
  - type: redis
    name: lumi-redis
    region: oregon
    plan: starter
    ipAllowList: []          # private network only — backend + worker share the region

databases:
  # ── Managed Postgres (for Prisma) ─────────────────────────
  - name: lumi-postgres
    databaseName: lumi_production
    user: lumi_user
    plan: starter
    region: oregon
