# ============================================================
# MARCOM — Render Blueprint
# Provisions: web service + PostgreSQL database.
# Deploy: connect this repo in render.com/new → Blueprint.
# ============================================================

services:
  - type: web
    name: marcom
    runtime: node
    plan: free
    buildCommand: npm install && npm run migrate
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production

      - key: ANTHROPIC_API_KEY
        sync: false          # REQUIRED: add in Render dashboard

      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-5

      - key: CLERK_PUBLISHABLE_KEY
        value: pk_test_Y2hvaWNlLWxpb25maXNoLTEwLmNsZXJrLmFjY291bnRzLmRldiQ

      - key: CLERK_SECRET_KEY
        sync: false          # REQUIRED: add in Render dashboard

      - key: WEBHOOK_SECRET
        generateValue: true  # Render generates a secure random value

      - key: DATABASE_URL
        fromDatabase:
          name: marcom-db
          property: connectionString

      - key: ALLOWED_ORIGINS
        sync: false          # Set to your Render URL after first deploy, e.g. https://marcom.onrender.com

      - key: LOG_LEVEL
        value: info

      # Optional — add in dashboard if you have these services:
      # REDIS_URL          — Upstash Redis (free at upstash.com)
      # SCRAPINGBEE_API_KEY — for URL scraping in onboarding
      # GMAIL_USER          — for email notifications
      # GMAIL_APP_PASSWORD  — for email notifications
      # NOTIFICATION_EMAIL  — alert destination
      # N8N_EXPORT_WEBHOOK  — n8n CRM sync URL
      # AIRTABLE_API_KEY    — legacy fallback (not used in production)

databases:
  - name: marcom-db
    plan: free
    databaseName: marcom
    user: marcom
