# ============================================================
# MARCOM / Lumi — Render.com Blueprint  (Phase 7)
# ------------------------------------------------------------
# Three services + one managed Postgres.
#
#   1. lumi-backend  — Express API + serves the React build
#   2. lumi-worker   — BullMQ Action + Observer workers
#   3. lumi-redis    — managed Redis (used by BullMQ)
#   4. lumi-postgres — managed Postgres (used by Prisma)
#
# Deviation from the V1.2 task spec: Render's blueprint schema
# puts Redis under `services:` (type: redis), NOT under
# `databases:`. Only Postgres lives under `databases:`. The file
# below uses Render's canonical schema so the blueprint imports
# cleanly via dashboard.render.com → New → Blueprint.
# ============================================================
services:
  # ── Web service: Express API + React static ───────────────
  - type: web
    name: lumi-backend
    env: node
    region: oregon
    plan: starter
    # `npm run build` itself runs `npm install --include=dev` for both
    # root and client, so we don't need a separate `npm install` here.
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ALLOWED_ORIGINS
        value: "https://marcom-marketing-os.onrender.com"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

      # Wired automatically from the blueprint-managed services
      - key: DATABASE_URL
        fromDatabase:
          name: lumi-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: lumi-redis
          property: connectionString

      # Auth
      - key: JWT_SECRET
        sync: false
      - key: JWT_ISSUER
        value: lumi-api
      - key: JWT_AUDIENCE
        value: lumi-clients

      # AI providers
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-5
      - key: OPENAI_API_KEY
        sync: false

      # Ad-platform credentials
      - key: GOOGLE_ADS_TOKEN
        sync: false

      # Notifications & link signing
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: HMAC_SECRET
        sync: false
      - key: QUICK_ACTION_HMAC_SECRET
        sync: false
      - key: WEBHOOK_SECRET
        sync: false

      # Firebase client config — baked into the bundle at Vite build time.
      # Values sourced from firebase.js hardcoded fallbacks (non-secret public config).
      # VITE_FIREBASE_PROJECT_ID is also tested by main.jsx CONFIG_VALID guard;
      # without it the app renders ConfigErrorPage instead of App.
      - key: VITE_FIREBASE_API_KEY
        value: AIzaSyCLtn1Q7dzhN-SU_BwsfVulFBzZcQJNgqw
      - key: VITE_FIREBASE_AUTH_DOMAIN
        value: marcom-ai-722f0.firebaseapp.com
      - key: VITE_FIREBASE_PROJECT_ID
        value: marcom-ai-722f0
      - key: VITE_FIREBASE_STORAGE_BUCKET
        value: marcom-ai-722f0.firebasestorage.app
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        value: "117077763726"
      - key: VITE_FIREBASE_APP_ID
        value: "1:117077763726:web:64f5bedc1e39204d4a4bdf"

      # Firebase Admin SDK (server-side — required for token verification)
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false

      # Credential vault
      - key: CREDENTIAL_ENCRYPTION_KEY
        sync: false

  # ── Background worker: BullMQ Action + Observer ───────────
  - type: worker
    name: lumi-worker
    env: node
    region: oregon
    plan: starter
    buildCommand: npm install
    startCommand: npm run worker
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lumi-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: lumi-redis
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: BULLMQ_CONCURRENCY
        value: 5
      - key: OBSERVER_CRON
        value: "*/15 * * * *"
      - key: OBSERVER_IMPACT_WINDOW_HRS
        value: 24
      - key: CREDENTIAL_ENCRYPTION_KEY
        sync: false

  # ── Managed Redis (for BullMQ) ────────────────────────────
  - type: redis
    name: lumi-redis
    region: oregon
    plan: starter
    ipAllowList: []          # private network only — backend + worker share the region

databases:
  # ── Managed Postgres (for Prisma) ─────────────────────────
  - name: lumi-postgres
    databaseName: lumi_production
    user: lumi_user
    plan: starter
    region: oregon
