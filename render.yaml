# ============================================================
# MARCOM / Lumi — Render.com Blueprint  (Phase 7)
# ------------------------------------------------------------
# Three services + one managed Postgres.
#
#   1. lumi-backend  — Express API + serves the React build
#   2. lumi-worker   — BullMQ Action + Observer workers
#   3. lumi-redis    — managed Redis (used by BullMQ)
#   4. lumi-postgres — managed Postgres (used by Prisma)
#
# Deviation from the V1.2 task spec: Render's blueprint schema
# puts Redis under `services:` (type: redis), NOT under
# `databases:`. Only Postgres lives under `databases:`. The file
# below uses Render's canonical schema so the blueprint imports
# cleanly via dashboard.render.com → New → Blueprint.
# ============================================================
# Source contract only. No sync/deploy without separate 03A cutover approval
# and live Web/Worker attestation in docs/BACKEND_STABILIZATION_03A.md.
# One separately authorized operator owns DDL; neither service auto-migrates.
previews:
  generation: off
services:
  # ── Web service: Express API + React static ───────────────
  - type: web
    name: lumi-backend
    runtime: node
    region: oregon
    plan: starter
    # Install from the lockfile, generate Prisma, compile the existing client.
    # No migrate/resolve/legacy SQL here or in preDeployCommand.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: ALLOWED_ORIGINS
        value: "https://marcom-marketing-os.onrender.com"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

      # Wired automatically from the blueprint-managed services
      - key: DATABASE_URL
        fromDatabase:
          name: lumi-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: lumi-redis
          property: connectionString

      # Auth
      - key: JWT_SECRET
        sync: false
      - key: JWT_ISSUER
        value: lumi-api
      - key: JWT_AUDIENCE
        value: lumi-clients

      # AI providers
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-5
      - key: OPENAI_API_KEY
        sync: false

      # Ad-platform credentials — Google Ads (names must match what the code reads:
      # googleAdsClient.js / ga4Client.js / routes/auth/google.js)
      - key: GOOGLE_ADS_DEVELOPER_TOKEN
        sync: false
      - key: GOOGLE_ADS_CLIENT_ID
        sync: false
      - key: GOOGLE_ADS_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: APP_BASE_URL
        value: https://marcom-marketing-os.onrender.com

      # Ad-platform credentials — Meta OAuth (routes/auth/meta.js + metaAdsService.js)
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_REDIRECT_URI
        sync: false

      # Notifications & link signing
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: HMAC_SECRET
        sync: false
      - key: QUICK_ACTION_HMAC_SECRET
        sync: false
      - key: WEBHOOK_SECRET
        sync: false

      # Firebase client config — baked into the bundle at Vite build time.
      # Values sourced from firebase.js hardcoded fallbacks (non-secret public config).
      # VITE_FIREBASE_PROJECT_ID is also tested by main.jsx CONFIG_VALID guard;
      # without it the app renders ConfigErrorPage instead of App.
      - key: VITE_FIREBASE_API_KEY
        value: AIzaSyCLtn1Q7dzhN-SU_BwsfVulFBzZcQJNgqw
      - key: VITE_FIREBASE_AUTH_DOMAIN
        value: marcom-ai-722f0.firebaseapp.com
      - key: VITE_FIREBASE_PROJECT_ID
        value: marcom-ai-722f0
      - key: VITE_FIREBASE_STORAGE_BUCKET
        value: marcom-ai-722f0.firebasestorage.app
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        value: "117077763726"
      - key: VITE_FIREBASE_APP_ID
        value: "1:117077763726:web:64f5bedc1e39204d4a4bdf"

      # Firebase Admin SDK (server-side — required for token verification)
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false

      # Credential vault
      - key: CREDENTIAL_ENCRYPTION_KEY
        sync: false

      # Admin panel allowlist — comma-separated operator emails granted
      # UserRole.ADMIN (gates /api/admin/*, requireAdmin). Web service only;
      # the worker serves no admin routes. sync:false → set in the dashboard.
      - key: ADMIN_EMAILS
        sync: false

      # Scoring-engine tuning — how far an actual-revenue upload (GA4/Shopify/
      # MANUAL) may lag the platform row before it stops overlaying ROAS and is
      # marked revenueStale (entityGraphEngine.REVENUE_MAX_AGE_MS). Code default
      # is 90; set here so it is tunable without a deploy.
      - key: REVENUE_MAX_AGE_DAYS
        value: "90"

      # ── DAILY additive observations (B4-D) ───────────────────────────
      # Turns on the THIRD connector fetch (`time_increment=1`), whose rows are
      # the only population that measures exactly one day. R8 built it and left it
      # off because nothing read it; B4-D turns it on so the evidence exists before
      # anything is asked to measure an outcome from it.
      #
      # SET ON BOTH SERVICES ON PURPOSE. runConnectorSync runs in two processes —
      # the cron loop on the worker, and the manual /connections/sync button on the
      # web service — and each reads its own process.env. Setting it on only one
      # would make the daily population depend on which trigger fired, which is the
      # split-brain the connectorConfig module exists to prevent.
      #
      # Exactly the string "true" enables it (isDailyIngestionEnabled); any other
      # value, or unset, leaves the path switched off and the sync otherwise intact.
      - key: DAILY_INGESTION_ENABLED
        value: "true"
      # Trailing days one daily fetch REQUESTS — a request bound, never a claim
      # about what a row measures. Clamped in code to [1, 28]; the code default is
      # 7, set here so the span is tunable without a deploy.
      - key: DAILY_INGESTION_DAYS
        value: "7"

  # ── Background worker: BullMQ Action + Observer ───────────
  - type: worker
    name: lumi-worker
    runtime: node
    region: oregon
    plan: starter
    # Keep Prisma CLI available under NODE_ENV=production; generate + static
    # backend checks only. No DDL or runtime worker startup during build.
    buildCommand: npm ci --include=dev && npm run build:worker
    startCommand: npm run worker
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lumi-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: lumi-redis
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: BULLMQ_CONCURRENCY
        value: 5
      - key: OBSERVER_CRON
        value: "*/15 * * * *"
      - key: OBSERVER_IMPACT_WINDOW_HRS
        value: 24
      # The 15-min agentic sweep heartbeat is OPT-IN (and it costs AI spend:
      # per-campaign reasoning + ANALYZE_PORTFOLIO every tick per workspace).
      # It runs ONLY when this is exactly "true"; any other value (or unset) =
      # OFF and the worker removes any persisted repeat on boot. Manual +
      # post-sync sweeps still run. Left explicit at "false" to document intent.
      # (Separately: on-read home sweeps never fan out to the AI gateway.)
      - key: AGENTIC_CRON_ENABLED
        value: "false"
      # Gates the post-sync sweep (syncWorker step 3). Each sync would otherwise
      # fan out to the AI gateway (per-campaign reasoning + ANALYZE_PORTFOLIO per
      # workspace) = AI spend on every ingest. Set to "false" to disable; the
      # worker still runs guardrail sweeps, and manual + on-read sweeps still
      # re-score. Any value other than "false" (or unset) leaves it ON.
      - key: SYNC_TRIGGERS_SWEEP
        value: "false"
      # MASTER SWITCH for all automatic (non-user-initiated) AI spend — the
      # backstop that keeps every AI request MANUAL. Default OFF: the sweep's
      # LLM narration (per-campaign reasoning + ANALYZE_PORTFOLIO) runs ONLY for a
      # user-initiated MANUAL sweep ("Run sweep", revenue upload); ON_READ home
      # sweeps and SCHEDULED sweeps (agentic cron, post-sync) never narrate, and
      # the weekly/monthly narrative cron is not scheduled (any persisted repeat is
      # removed on boot). Copilot + Content Lab (both user-initiated) are unaffected.
      # Set to "true" to re-enable background AI. This gates the fan-out even if the
      # finer AGENTIC_CRON_ENABLED / SYNC_TRIGGERS_SWEEP flags are misconfigured.
      - key: AI_AUTOMATIC_ENABLED
        value: "false"

      # ── DAILY additive observations (B4-D) ───────────────────────────
      # Turns on the THIRD connector fetch (`time_increment=1`), whose rows are
      # the only population that measures exactly one day. R8 built it and left it
      # off because nothing read it; B4-D turns it on so the evidence exists before
      # anything is asked to measure an outcome from it.
      #
      # SET ON BOTH SERVICES ON PURPOSE. runConnectorSync runs in two processes —
      # the cron loop on the worker, and the manual /connections/sync button on the
      # web service — and each reads its own process.env. Setting it on only one
      # would make the daily population depend on which trigger fired, which is the
      # split-brain the connectorConfig module exists to prevent.
      #
      # Exactly the string "true" enables it (isDailyIngestionEnabled); any other
      # value, or unset, leaves the path switched off and the sync otherwise intact.
      - key: DAILY_INGESTION_ENABLED
        value: "true"
      # Trailing days one daily fetch REQUESTS — a request bound, never a claim
      # about what a row measures. Clamped in code to [1, 28]; the code default is
      # 7, set here so the span is tunable without a deploy.
      - key: DAILY_INGESTION_DAYS
        value: "7"
      - key: CREDENTIAL_ENCRYPTION_KEY
        sync: false

  # ── Managed Redis (for BullMQ) ────────────────────────────
  - type: redis
    name: lumi-redis
    region: oregon
    plan: starter
    ipAllowList: []          # private network only — backend + worker share the region

databases:
  # ── Managed Postgres (for Prisma) ─────────────────────────
  - name: lumi-postgres
    databaseName: lumi_production
    user: lumi_user
    plan: starter
    region: oregon
