# ============================================================
# MARCOM Tests — vitest across backend, packages, and frontend
# ============================================================
# Runs on every PR + push to master. Backend + package tests
# share a vitest run at root (default discovery picks up
# src/ + packages/runtime-contracts/). Frontend tests use the
# client workspace's own vitest config (JSDOM + React Testing
# Library).
# ============================================================
name: Tests

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend + package contract tests
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://test_user:test_password@localhost:5432/marcom_test"
      DIRECT_URL: "postgresql://test_user:test_password@localhost:5432/marcom_test"
      # B5-CI-01. The isolation ROOT for full verification. It is a naming and
      # admin root, not a database this run connects to: globalSetup rewrites the
      # path to /postgres to CREATE and DROP, and derives marcom_verify_tmpl +
      # marcom_verify_w1..N from the name. `marcom_verify` therefore does not
      # need to exist, and deliberately does not.
      #
      # It MUST NOT name the same database as DATABASE_URL. Full verification
      # drops and recreates everything derived from this root, so
      # resolveIsolationRoot() refuses to start when the two resolve to the same
      # PostgreSQL identity (host + port + name). Keeping DATABASE_URL pointed at
      # a different name means that guard is actually exercised here rather than
      # skipped for want of an ambient value.
      TEST_DATABASE_URL: "postgresql://test_user:test_password@localhost:5432/marcom_verify"

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: marcom_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          # B5-01K: read the pin from .nvmrc, never a literal here. '24' also
          # matched 24.15.x, the runtime whose worker crash silently drops a
          # test module. See scripts/runtimeContract.js.
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies (workspace-wide)
        run: npm ci

      # NO `prisma migrate deploy` STEP, deliberately (B5-CI-01 §8).
      #
      # Migration ownership belongs to full verification, which migrates the
      # TEMPLATE database itself (src/tests/globalSetup.js runs `prisma migrate
      # deploy` against marcom_verify_tmpl, then clones each worker database from
      # it) and FAILS the run if that migration fails. Nothing in this job reads
      # the shared marcom_test database: workerDb.js overwrites DATABASE_URL and
      # DIRECT_URL inside every worker before the first import of the Prisma
      # client. A second migrate step here would be a parallel ritual that proves
      # nothing the provisioner does not already prove, on a database no test
      # touches.

      - name: Run backend full verification (REQUIRE_DB=1)
        # B5-CI-01. This was `npx vitest run`, which bypassed
        # scripts/run-tests.js — the repository's verification owner — and so
        # made a WEAKER claim than the repository's own contract. REQUIRE_DB was
        # unset, DB-backed suites were permitted to skip, and they did: measured
        # on 6505872, CI reported `5127 passed | 36 skipped` where `test:full`
        # reports `5163 passed | 0 skipped`. Among the skipped were all six tests
        # of the worker schema-readiness gate — a safety property about not
        # mutating a live ad platform against a stale schema, invisible to a
        # green badge.
        #
        # `npm run test:full` is the same suite plus a requirement. It is not a
        # different file list; `include` in vitest.config.js remains the single
        # definition of what the backend suite IS. Routing through the script
        # also activates the Node runtime guard (B5-01K), which raw vitest skips.
        #
        # Still no path arguments. Positional paths OVERRIDE the `include` globs
        # in vitest.config.js, and the list that used to sit here had become an
        # allowlist the repository had outgrown: src/middleware, src/workers,
        # src/lib, src/models, src/agents, src/config, src/modes and src/tests
        # all held test files CI never ran — including R11 identity,
        # authorization and worker re-authorization suites. A green run said
        # nothing about them.
        run: npm run test:full

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          # B5-01K: read the pin from .nvmrc, never a literal here. '24' also
          # matched 24.15.x, the runtime whose worker crash silently drops a
          # test module. See scripts/runtimeContract.js.
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies (workspace-wide)
        run: npm ci

      - name: Run frontend tests
        # Uses client/vitest.config.ts (JSDOM + React Testing Library).
        run: npm run test --workspace client
