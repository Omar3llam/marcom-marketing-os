# ============================================================
# MARCOM Tests — vitest across backend, packages, and frontend
# ============================================================
# Runs on every PR + push to master. Backend + package tests
# share a vitest run at root (default discovery picks up
# src/ + packages/runtime-contracts/). Frontend tests use the
# client workspace's own vitest config (JSDOM + React Testing
# Library).
# ============================================================
name: Tests

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend + package contract tests
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://test_user:test_password@localhost:5432/marcom_test"
      DIRECT_URL: "postgresql://test_user:test_password@localhost:5432/marcom_test"

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: marcom_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          # B5-01K: read the pin from .nvmrc, never a literal here. '24' also
          # matched 24.15.x, the runtime whose worker crash silently drops a
          # test module. See scripts/runtimeContract.js.
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies (workspace-wide)
        run: npm ci

      - name: Set up test database schema
        run: npx prisma migrate deploy

      - name: Run backend + contract tests
        # No path arguments. Positional paths OVERRIDE the `include` globs in
        # vitest.config.js, and the list that used to sit here had become an
        # allowlist the repository had outgrown: src/middleware, src/workers,
        # src/lib, src/models, src/agents, src/config, src/modes and src/tests
        # all held test files CI never ran — including R11 identity,
        # authorization and worker re-authorization suites. A green run said
        # nothing about them.
        #
        # The config already scopes discovery correctly: it includes only
        # src/**/*.test.js + packages/**/*.test.js, and already excludes
        # client/** (its own jsdom config), Playwright specs, and
        # src/tests/dialect.test.js (a standalone node script, not a suite).
        #
        # The old note here said resilience.integration.test.js had
        # "pre-existing failures". That was true, and it stayed true precisely
        # because excluding it meant nobody ever saw them. Its three defects
        # are fixed in this PR; the fourth — CampaignStage missing from a
        # migration-built database — was fixed by R12-1e.
        run: npx vitest run

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          # B5-01K: read the pin from .nvmrc, never a literal here. '24' also
          # matched 24.15.x, the runtime whose worker crash silently drops a
          # test module. See scripts/runtimeContract.js.
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies (workspace-wide)
        run: npm ci

      - name: Run frontend tests
        # Uses client/vitest.config.ts (JSDOM + React Testing Library).
        run: npm run test --workspace client
