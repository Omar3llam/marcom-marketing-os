# ============================================================
# MARCOM Tests — vitest across backend, packages, and frontend
# ============================================================
# Runs on every PR + push to master. Backend + package tests
# share a vitest run at root (default discovery picks up
# src/ + packages/runtime-contracts/). Frontend tests use the
# client workspace's own vitest config (JSDOM + React Testing
# Library).
# ============================================================
name: Tests

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend + package contract tests
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://test_user:test_password@localhost:5432/marcom_test"
      DIRECT_URL: "postgresql://test_user:test_password@localhost:5432/marcom_test"

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: marcom_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies (workspace-wide)
        run: npm ci

      - name: Set up test database schema
        run: npx prisma migrate deploy

      - name: Run backend + contract tests
        # No path arguments. Positional paths OVERRIDE the `include` globs in
        # vitest.config.js, and the list that used to sit here had become an
        # allowlist the repository outgrew: src/middleware, src/workers,
        # src/lib, src/models, src/agents, src/config, src/modes and src/tests
        # all grew test files that CI never ran — including the R11 identity,
        # authorization, rate-limit, dev-override and worker re-authorization
        # controls. A green run has to mean the backend test surface that
        # EXISTS was exercised, so discovery lives in vitest.config.js (which
        # already scopes to backend and excludes the one standalone script)
        # and a new test file enters CI by existing, not by someone
        # remembering to edit this file.
        #
        # src/utils/ciCoverage.test.js fails if a path list reappears here.
        run: npx vitest run

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies (workspace-wide)
        run: npm ci

      - name: Run frontend tests
        # Uses client/vitest.config.ts (JSDOM + React Testing Library).
        run: npm run test --workspace client
