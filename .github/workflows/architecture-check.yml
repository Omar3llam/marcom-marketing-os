# ============================================================
# MARCOM Architecture Check — runs on every PR + push to master
# ============================================================
# Token-discipline lint, architecture audit, security audit, and
# bundle-size budget. Workspace-aware (PR #8: npm workspaces).
# ============================================================
name: Architecture Check

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

permissions:
  contents: read

jobs:
  architecture-audit:
    name: Architecture & Token Discipline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          # B5-01K: read the pin from .nvmrc, never a literal here.
          node-version-file: '.nvmrc'
          cache: 'npm'
          # Workspaces use the root lockfile (client/package-lock.json
          # was removed by PR #8).
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies (workspace-wide)
        # Single hoisted install covers root + client + packages/*
        run: npm ci

      # ── Backend static gates (B5-CI-01) ────────────────────────
      # Both were LOCAL_ONLY: enforced by .husky/pre-commit, which blocks a
      # commit when either exits non-zero, and `check` additionally gates
      # `npm start` through `prestart`. So the repository already treats them as
      # required correctness gates — CI simply did not represent them, which
      # means anything that reached master without passing through a local
      # commit hook (a web edit, a merge resolution, a --no-verify commit) was
      # never checked at all.
      #
      # Named separately rather than chained, so the report says WHICH gate
      # failed. `check` runs first: it is the cheaper one and a syntax error
      # makes every later gate's output noise.

      - name: Run backend static check
        # node --check on every src/**/*.js, plus the @/ alias guard — Node
        # cannot resolve those at runtime, so one is a production crash.
        run: npm run check

      - name: Run backend lint
        # eslint src/. no-undef is an ERROR (a missing variable is a runtime
        # crash); unused vars are warnings by policy, so the 27 existing
        # warnings do not fail this step and the gate is real rather than
        # aspirational.
        run: npm run lint

      - name: Run ESLint (token discipline)
        # Workspace invocation so the script runs inside client/ with
        # its own eslint config + plugins.
        run: npm run lint:ci --workspace client
        # Fails if any no-generic-tailwind violations exist

      - name: Boot check (does the server's module graph load?)
        run: node scripts/boot-check.js
        # The gate that was missing when PRs #312 and #313 merged cleanly into a
        # master that could not parse. Both were green; neither was wrong alone.
        # Parses every backend file, then proves server.js's whole static import
        # graph resolves. Runs BEFORE the slower audits so a non-booting tree
        # fails in seconds.

      - name: Run architecture audit
        run: node scripts/arch-check.js
        # Fails on: size violations, forbidden imports, raw hex, N+1, duplicates

      - name: Security audit
        run: node scripts/security-check.js
        # Fails on: IDOR, SQL injection, XSS, 403 leakage

      - name: Build client
        run: npm run build --workspace client

      # FE-01 — a colour class that does not EXIST renders nothing, and the
      # token linter cannot see it: `no-generic-tailwind` is a denylist, so it
      # bans nine named hues and waves through any class it was never told
      # about. Measured on a30c912: 60 undefined classes across 180 call sites,
      # all of them in linted files, all of them green. This asks the only
      # question that catches them — did Tailwind emit a rule for what you
      # wrote? — and so it must run AFTER the build.
      - name: Token resolution (every colour class exists)
        working-directory: client
        run: npm run check:tokens

      - name: Bundle size budget (gzip <700KB)
        working-directory: client
        run: |
          # Measure gzip-compressed size — what browsers actually download.
          # Raw bytes is misleading: Firebase+React vendor chunks alone are
          # ~345KB raw but ~93KB gzip. Budget is enforced on gzip bytes.
          bundle_size=$(find dist/assets -name "*.js" -exec gzip -c {} \; | wc -c)
          max_size=$((700 * 1024))
          if [ "$bundle_size" -gt "$max_size" ]; then
            echo "::error::Bundle too large (gzip): ${bundle_size} bytes (max ${max_size})"
            exit 1
          fi
          echo "✅ Bundle size (gzip): ${bundle_size} bytes"
