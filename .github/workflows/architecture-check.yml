# ============================================================
# MARCOM Architecture Check — runs on every PR + push to master
# ============================================================
# Token-discipline lint, architecture audit, security audit, and
# bundle-size budget. Workspace-aware (PR #8: npm workspaces).
# ============================================================
name: Architecture Check

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

jobs:
  architecture-audit:
    name: Architecture & Token Discipline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          # Workspaces use the root lockfile (client/package-lock.json
          # was removed by PR #8).
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies (workspace-wide)
        # Single hoisted install covers root + client + packages/*
        run: npm ci

      - name: Run ESLint (token discipline)
        # Workspace invocation so the script runs inside client/ with
        # its own eslint config + plugins.
        run: npm run lint:ci --workspace client
        # Fails if any no-generic-tailwind violations exist

      - name: Run architecture audit
        run: node scripts/arch-check.js
        # Fails on: size violations, forbidden imports, raw hex, N+1, duplicates

      - name: Security audit
        run: node scripts/security-check.js
        # Fails on: IDOR, SQL injection, XSS, 403 leakage

      - name: Build client
        run: npm run build --workspace client

      - name: Bundle size budget (<700KB)
        working-directory: client
        run: |
          bundle_size=$(find dist/assets -name "*.js" | xargs wc -c | tail -1 | awk '{print $1}')
          max_size=$((700 * 1024))
          if [ "$bundle_size" -gt "$max_size" ]; then
            echo "::error::Bundle too large: ${bundle_size} bytes (max ${max_size})"
            exit 1
          fi
          echo "✅ Bundle size: ${bundle_size} bytes"
